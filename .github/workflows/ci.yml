name: Hedge Fund CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run unit tests
        env:
          ALPACA_DRY_RUN: "true"
          ALPACA_PAPER: "true"
          SIMFIN_API_KEY: "free"
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=hedge_fund_ai --cov-report=term-missing --cov-fail-under=60
      - name: Backtest regression check
        run: |
          python -c "
          import numpy as np, pandas as pd
          from hedge_fund_ai.backtest.metrics import compute_metrics
          np.random.seed(42)
          equity = pd.Series(np.cumprod(1 + np.random.randn(500)*0.008))
          m = compute_metrics(equity)
          assert 'sharpe' in m and np.isfinite(m['sharpe']), f'Sharpe fail: {m}'
          assert m['max_drawdown'] <= 0, 'Drawdown regression failed'
          print('All regression checks passed:', m)
          "
      - name: Check no hardcoded secrets
        run: |
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . 2>/dev/null; then
            echo "Hardcoded API key detected!" && exit 1
          fi
          echo "No hardcoded secrets found."
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check hedge_fund_ai/ --select=E,F,W --ignore=E501,W291,W293 || true
